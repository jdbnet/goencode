name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: build-htz-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        id: semantic
        uses: https://git.jdbnet.co.uk/jamie/go-semantic-release-provider-gitea@v1.2.3
        with:
          gitea-host: ${{ gitea.server_url }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}

      - name: Checkout release tag
        if: steps.semantic.outputs.version != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.semantic.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        if: steps.semantic.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Binary
        if: steps.semantic.outputs.version != ''
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ steps.semantic.outputs.version }}" -o goencode ./cmd/goencode

      - name: Build and push Docker image
        if: steps.semantic.outputs.version != ''
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          IMAGE="cr.jdbnet.co.uk/public/goencode"
          docker build --build-arg APP_VERSION=$VERSION -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION && docker push $IMAGE:latest

      - name: Upload release assets
        if: steps.semantic.outputs.version != ''
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: v${{ steps.semantic.outputs.version }}
          name: v${{ steps.semantic.outputs.version }}
          files: |
            goencode

      - name: Upload to Cloudflare R2
        if: steps.semantic.outputs.version != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          printf '%s\n' "$VERSION" > goencode.version
          sha256sum goencode | awk '{print $1}' > goencode.sha256
          aws s3 cp goencode s3://apps/goencode --endpoint-url "$R2_ENDPOINT"
          aws s3 cp goencode.version s3://apps/goencode.version --endpoint-url "$R2_ENDPOINT"
          aws s3 cp goencode.sha256 s3://apps/goencode.sha256 --endpoint-url "$R2_ENDPOINT"
