services:
  db:
    image: mariadb:12
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: encoder
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GOENCODE_DB_DRIVER=mysql
      - GOENCODE_DB_HOST=db
      - GOENCODE_DB_PORT=3306
      - GOENCODE_DB_USER=root
      - GOENCODE_DB_PASS=root
      - GOENCODE_DB_NAME=encoder
    volumes:
      - ./goencode.yaml:/etc/goencode/config.yaml:ro
      - ./media:/media
    depends_on:
      - db

volumes:
  db_data:
