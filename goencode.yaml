server:
  port: 8080
  listen_addr: "0.0.0.0"
  timezone: "UTC"

auth:
  username: "admin"
  password: "password"

database:
  driver: sqlite
  path: goencode.db
  # driver: mysql
  # host: "db"
  # port: 3306
  # user: "root"
  # password: "root"
  # name: "encoder"

encoder:
  ffmpeg_path: "ffmpeg"
  temp_dir: "/tmp/goencode"
  workers: 1
  threads: 0
  min_free_gb: 5

downloader:
  ytdlp_path: "yt-dlp"
  workers: 1
  # YouTube and some sites require logged-in cookies. Upload cookies.txt in the
  # Download page UI, or export from your browser and point to it here.
  # cookies_file: "/etc/goencode/cookies.txt"
  # For bare-metal installs only (not Docker): read cookies directly from a browser profile.
  # cookies_from_browser: "chrome"

logging:
  level: "info"

